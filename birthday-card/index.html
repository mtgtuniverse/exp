<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skapa ett födelsedagskort 🎂</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: linear-gradient(135deg, #fde68a 0%, #fca5a5 50%, #a5b4fc 100%);
    color: #334155;
  }
  .card {
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.15);
    padding: 32px;
    max-width: 480px;
    width: 100%;
  }
  h1 { margin: 0 0 4px; font-size: 26px; color: #be123c; }
  p.sub { margin: 0 0 24px; color: #64748b; font-size: 15px; }
  label { display: block; font-weight: 600; margin: 16px 0 6px; font-size: 14px; }
  input, textarea, select {
    width: 100%;
    border: 2px solid #e2e8f0;
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 16px;
    font-family: inherit;
    transition: border-color .15s;
  }
  input:focus, textarea:focus, select:focus { outline: none; border-color: #f472b6; }
  textarea { resize: vertical; min-height: 90px; }
  .emoji-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  .emoji-btn {
    font-size: 24px; background: #f1f5f9; border: 2px solid transparent;
    border-radius: 12px; padding: 6px 10px; cursor: pointer; transition: all .15s;
  }
  .emoji-btn:hover { background: #e2e8f0; }
  .emoji-btn.active { border-color: #f472b6; background: #fce7f3; }
  button.primary {
    margin-top: 24px; width: 100%; border: none; border-radius: 12px;
    padding: 16px; font-size: 17px; font-weight: 700; color: #fff; cursor: pointer;
    background: linear-gradient(135deg, #f472b6, #be123c);
    transition: transform .1s, box-shadow .2s;
  }
  button.primary:hover { box-shadow: 0 8px 20px rgba(190,18,60,.3); }
  button.primary:active { transform: scale(.98); }
  .result { margin-top: 20px; display: none; }
  .result.show { display: block; }
  .link-box {
    display: flex; gap: 8px; margin-top: 8px;
  }
  .link-box input { font-size: 13px; background: #f8fafc; }
  .copy-btn {
    border: none; border-radius: 12px; padding: 0 18px; font-weight: 600;
    background: #0d9488; color: #fff; cursor: pointer; white-space: nowrap;
  }
  .copy-btn.done { background: #16a34a; }
  .preview-link { display: inline-block; margin-top: 14px; color: #be123c; font-weight: 600; text-decoration: none; }
  .preview-link:hover { text-decoration: underline; }
  .qr-wrap { margin-top: 20px; text-align: center; }
  .qr-wrap p { margin: 0 0 10px; font-size: 14px; color: #64748b; }
  #qrcode {
    display: inline-block; padding: 14px; background: #fff;
    border: 2px solid #e2e8f0; border-radius: 16px; line-height: 0;
  }
  #qrcode img, #qrcode canvas { display: block; }
  .qr-actions { display: flex; gap: 8px; justify-content: center; margin-top: 12px; }
  .qr-btn {
    border: none; border-radius: 10px; padding: 10px 16px; font-weight: 600;
    font-size: 14px; cursor: pointer; background: #0d9488; color: #fff;
    transition: background .15s;
  }
  .qr-btn:hover { background: #0f766e; }
  .qr-btn.done { background: #16a34a; }
</style>
</head>
<body>
  <div class="card">
    <h1>Skapa en hälsning 🎉</h1>
    <p class="sub">Fyll i, tryck på knappen och skicka länken till den du vill glädja!</p>

    <label for="to">Till vem?</label>
    <input id="to" type="text" placeholder="t.ex. Alva" maxlength="40">

    <label for="greeting">Hälsningsfras</label>
    <select id="greeting">
      <option value="Grattis på födelsedagen!">Grattis på födelsedagen!</option>
      <option value="Du är bäst!">Du är bäst!</option>
      <option value="En hälsning från mig!">En hälsning från mig!</option>
      <option value="__custom__">✏️ Egen fras…</option>
    </select>
    <input id="greetingCustom" type="text" placeholder="Skriv din egen hälsningsfras" maxlength="60" style="display:none; margin-top:8px;">

    <label for="msg">Meddelande (valfritt)</label>
    <textarea id="msg" placeholder="Hoppas du får en superdag 🎈" maxlength="300"></textarea>

    <label for="from">Från</label>
    <input id="from" type="text" placeholder="t.ex. Max" maxlength="40">

    <label>Välj en symbol</label>
    <div class="emoji-row" id="emojiRow">
      <button type="button" class="emoji-btn active" data-emoji="🎂">🎂</button>
      <button type="button" class="emoji-btn" data-emoji="🎈">🎈</button>
      <button type="button" class="emoji-btn" data-emoji="🎁">🎁</button>
      <button type="button" class="emoji-btn" data-emoji="🦖">🦖</button>
      <button type="button" class="emoji-btn" data-emoji="⚽">⚽</button>
      <button type="button" class="emoji-btn" data-emoji="🚀">🚀</button>
      <button type="button" class="emoji-btn" data-emoji="🦄">🦄</button>
      <button type="button" class="emoji-btn" data-emoji="🐱">🐱</button>
    </div>

    <button class="primary" id="makeBtn">Skapa länk 🔗</button>

    <div class="result" id="result">
      <label>Här är länken – kopiera och skicka den!</label>
      <div class="link-box">
        <input id="linkOut" type="text" readonly>
        <button class="copy-btn" id="copyBtn">Kopiera</button>
      </div>
      <a class="preview-link" id="previewLink" target="_blank" rel="noopener">👀 Förhandsvisa kortet</a>

      <div class="qr-wrap">
        <p>…eller låt kompisen scanna QR-koden 📷</p>
        <div id="qrcode"></div>
        <div class="qr-actions">
          <button type="button" class="qr-btn" id="copyQrBtn">Kopiera QR-kod</button>
          <button type="button" class="qr-btn" id="dlQrBtn">Ladda ner</button>
        </div>
      </div>
    </div>
  </div>

  <script src="vendor/qrcode.min.js"></script>

<script>
  let chosenEmoji = "🎂";
  const emojiRow = document.getElementById("emojiRow");
  emojiRow.addEventListener("click", (e) => {
    const btn = e.target.closest(".emoji-btn");
    if (!btn) return;
    document.querySelectorAll(".emoji-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    chosenEmoji = btn.dataset.emoji;
  });

  const greetingSel = document.getElementById("greeting");
  const greetingCustom = document.getElementById("greetingCustom");
  greetingSel.addEventListener("change", () => {
    if (greetingSel.value === "__custom__") {
      greetingCustom.style.display = "block";
      greetingCustom.focus();
    } else {
      greetingCustom.style.display = "none";
    }
  });

  function getGreeting() {
    if (greetingSel.value === "__custom__") {
      return greetingCustom.value.trim() || "Grattis på födelsedagen!";
    }
    return greetingSel.value;
  }

  function encodeData(obj) {
    // UTF-8 safe base64
    return btoa(unescape(encodeURIComponent(JSON.stringify(obj))));
  }

  document.getElementById("makeBtn").addEventListener("click", () => {
    const to = document.getElementById("to").value.trim();
    const msg = document.getElementById("msg").value.trim();
    const from = document.getElementById("from").value.trim();
    const greeting = getGreeting();

    const data = { to, msg, from, g: greeting, e: chosenEmoji };
    const encoded = encodeData(data);
    // Ta bort ev. "index.html" eller "index" på slutet och säkerställ avslutande slash
    let base = location.pathname.replace(/(index\.html|index)$/, "");
    if (!base.endsWith("/")) base += "/";
    const url = location.origin + base + "card#" + encoded;

    const linkOut = document.getElementById("linkOut");
    linkOut.value = url;
    document.getElementById("previewLink").href = url;
    document.getElementById("result").classList.add("show");

    renderQR(url);
  });

  function renderQR(url) {
    const container = document.getElementById("qrcode");
    container.innerHTML = "";
    if (typeof QRCode === "undefined") {
      container.innerHTML = "<p style='color:#94a3b8;font-size:13px'>QR-koden kunde inte laddas (kräver internet).</p>";
      return;
    }
    new QRCode(container, {
      text: url,
      width: 180,
      height: 180,
      colorDark: "#000000",
      colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.L
    });
  }

  // Hämta QR-koden som en canvas (qrcodejs ritar både canvas och img)
  function getQrCanvas() {
    const container = document.getElementById("qrcode");
    let canvas = container.querySelector("canvas");
    if (canvas) return Promise.resolve(canvas);
    // Fallback: bygg en canvas från img-elementet
    const img = container.querySelector("img");
    if (!img) return Promise.resolve(null);
    return new Promise((resolve) => {
      const c = document.createElement("canvas");
      c.width = img.naturalWidth || 180;
      c.height = img.naturalHeight || 180;
      const draw = () => {
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        resolve(c);
      };
      if (img.complete) draw(); else img.onload = draw;
    });
  }

  function flash(btn, text) {
    const original = btn.textContent;
    btn.textContent = text;
    btn.classList.add("done");
    setTimeout(() => { btn.textContent = original; btn.classList.remove("done"); }, 2000);
  }

  document.getElementById("copyQrBtn").addEventListener("click", async () => {
    const btn = document.getElementById("copyQrBtn");
    const canvas = await getQrCanvas();
    if (!canvas) { alert("Kunde inte läsa QR-koden."); return; }
    try {
      const blob = await new Promise((res) => canvas.toBlob(res, "image/png"));
      await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]);
      flash(btn, "Kopierad! ✓");
    } catch {
      // Bildkopiering stöds inte här – ladda ner istället
      downloadQr();
      flash(btn, "Nedladdad ✓");
    }
  });

  function downloadQr() {
    getQrCanvas().then((canvas) => {
      if (!canvas) { alert("Kunde inte läsa QR-koden."); return; }
      const a = document.createElement("a");
      a.href = canvas.toDataURL("image/png");
      a.download = "fodelsedagskort-qr.png";
      a.click();
    });
  }

  document.getElementById("dlQrBtn").addEventListener("click", () => {
    downloadQr();
    flash(document.getElementById("dlQrBtn"), "Nedladdad ✓");
  });

  const copyBtn = document.getElementById("copyBtn");
  copyBtn.addEventListener("click", async () => {
    const linkOut = document.getElementById("linkOut");
    try {
      await navigator.clipboard.writeText(linkOut.value);
    } catch {
      linkOut.select();
      document.execCommand("copy");
    }
    copyBtn.textContent = "Kopierat! ✓";
    copyBtn.classList.add("done");
    setTimeout(() => { copyBtn.textContent = "Kopiera"; copyBtn.classList.remove("done"); }, 2000);
  });
</script>
</body>
</html>
